name: Entrega continua AWS - Lambda

env:
  AWS_REGION: us-east-1
  PROJECT_NAME: oficina-mecanica
  DOTNET_VERSION: 10.0.x
  TERRAFORM_VERSION: 1.15.8
  TF_IN_AUTOMATION: true

on:
  workflow_dispatch:

concurrency:
  group: oficina-mecanica-auth-lambda-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy authentication Lambda
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Validate production branch
        run: >-
          test "$GITHUB_REF_NAME" = "main" ||
          { echo "::error::O deploy deve ser executado a partir da branch main."; exit 1; }

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Locate shared Terraform state
        id: state
        run: |
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          state_bucket="${PROJECT_NAME}-terraform-state-${account_id}"
          aws s3api head-bucket --bucket "$state_bucket" || {
            echo "::error::Execute primeiro a Entrega continua AWS do repositorio da aplicacao."
            exit 1
          }
          echo "state_bucket=${state_bucket}" >> "$GITHUB_OUTPUT"

      - name: Build deployment package
        run: |
          dotnet restore OficinaMecanica.Auth.slnx
          dotnet test OficinaMecanica.Auth.slnx --configuration Release --no-restore
          dotnet publish src/OficinaMecanica.Auth.Function/OficinaMecanica.Auth.Function.csproj \
            --configuration Release \
            --runtime linux-x64 \
            --self-contained false \
            --output artifacts/lambda

      - name: Terraform init
        run: >-
          terraform -chdir=infra init
          -input=false
          -backend-config="bucket=${{ steps.state.outputs.state_bucket }}"

      - name: Terraform validate
        run: terraform -chdir=infra validate -no-color

      - name: Terraform plan
        env:
          TF_VAR_state_bucket_name: ${{ steps.state.outputs.state_bucket }}
        run: terraform -chdir=infra plan -input=false -no-color -out=lambda.tfplan

      - name: Terraform apply
        env:
          TF_VAR_state_bucket_name: ${{ steps.state.outputs.state_bucket }}
        run: terraform -chdir=infra apply -input=false lambda.tfplan

      - name: Validate authentication endpoint
        env:
          TF_VAR_state_bucket_name: ${{ steps.state.outputs.state_bucket }}
        run: |
          auth_url="$(terraform -chdir=infra output -raw authentication_url)"
          response_file="$(mktemp)"
          http_status="$(curl --silent --show-error \
            --retry 12 --retry-all-errors --retry-delay 5 --max-time 15 \
            --output "$response_file" --write-out '%{http_code}' \
            --header 'Content-Type: application/json' \
            --data '{"cpf":"52998224725"}' \
            "$auth_url")"

          if [[ "$http_status" != "200" && "$http_status" != "404" ]]; then
            cat "$response_file"
            echo "::error::A Lambda respondeu HTTP ${http_status}; era esperado 200 ou 404."
            exit 1
          fi

          echo "### Lambda de autenticacao implantada" >> "$GITHUB_STEP_SUMMARY"
          echo "Endpoint: ${auth_url}" >> "$GITHUB_STEP_SUMMARY"
          echo "Teste de acesso ao RDS: HTTP ${http_status}" >> "$GITHUB_STEP_SUMMARY"
